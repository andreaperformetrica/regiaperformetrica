<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Regia Performetrica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: app shell — sidebar di navigazione, area di lavoro con viste (elenco/bacheca/timeline/calendario), pannello attività a destra */
:root{
  --bg:#f4f4f6; --surface:#ffffff; --surface-2:#efeff3; --surface-3:#e6e6ec;
  --line:#e2e2e8; --line-2:#cfcfd8;
  --fg:#1a1b22; --fg-2:#545663; --fg-3:#8b8d99;
  --accent:#4f52d9; --accent-fg:#ffffff; --accent-soft:#e8e8fc; --accent-line:#c9caf6;
  --danger:#d9363e; --warn:#cf7d00; --ok:#24915a;
  --st-todo:#8b8d99; --st-progress:#4f52d9; --st-review:#d9890b; --st-done:#24915a;
  --pr-urgent:#e5484d; --pr-high:#ec8a00; --pr-normal:#3b7be0; --pr-low:#9a9ca8;
  --c0:#9a9ca8; --c1:#5b5bd6; --c2:#0f9b8e; --c3:#e5484d; --c4:#e07b00; --c5:#2f9e63;
  --c6:#c2399b; --c7:#3b7be0; --c8:#9a6a2f; --c9:#7c4dce; --c10:#5f6b7a;
  --av-fg:#ffffff;
  --shadow:0 1px 2px rgb(20 20 40 / .06), 0 8px 24px rgb(20 20 40 / .08);
  --shadow-lg:0 2px 6px rgb(20 20 40 / .08), 0 24px 60px rgb(20 20 40 / .18);
  --font-display:"Bricolage Grotesque", "Geist", ui-sans-serif, system-ui, sans-serif;
  --font-body:"Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono:"Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:8px; --r-sm:6px; --tln:240px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#111216; --surface:#18191e; --surface-2:#1f2026; --surface-3:#282930;
  --line:#2a2b33; --line-2:#3a3b45;
  --fg:#e9e9ee; --fg-2:#a9aab6; --fg-3:#6f717d;
  --accent:#8587ff; --accent-fg:#0f1020; --accent-soft:#25264a; --accent-line:#3d3f7a;
  --danger:#ff6b70; --warn:#ffb340; --ok:#4cc38a;
  --st-todo:#7d7f8c; --st-progress:#8587ff; --st-review:#ffb340; --st-done:#4cc38a;
  --pr-urgent:#ff6b70; --pr-high:#ffa94d; --pr-normal:#6aa6ff; --pr-low:#7d7f8c;
  --c0:#7d7f8c; --c1:#8b8dff; --c2:#3cc7b6; --c3:#ff6b70; --c4:#ffa94d; --c5:#4cc38a;
  --c6:#e86bc7; --c7:#6aa6ff; --c8:#c99a5b; --c9:#a98bf0; --c10:#8b97a6;
  --av-fg:#121318;
  --shadow:0 1px 2px rgb(0 0 0 / .3), 0 8px 24px rgb(0 0 0 / .3);
  --shadow-lg:0 2px 6px rgb(0 0 0 / .4), 0 24px 60px rgb(0 0 0 / .55);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#111216; --surface:#18191e; --surface-2:#1f2026; --surface-3:#282930;
  --line:#2a2b33; --line-2:#3a3b45;
  --fg:#e9e9ee; --fg-2:#a9aab6; --fg-3:#6f717d;
  --accent:#8587ff; --accent-fg:#0f1020; --accent-soft:#25264a; --accent-line:#3d3f7a;
  --danger:#ff6b70; --warn:#ffb340; --ok:#4cc38a;
  --st-todo:#7d7f8c; --st-progress:#8587ff; --st-review:#ffb340; --st-done:#4cc38a;
  --pr-urgent:#ff6b70; --pr-high:#ffa94d; --pr-normal:#6aa6ff; --pr-low:#7d7f8c;
  --c0:#7d7f8c; --c1:#8b8dff; --c2:#3cc7b6; --c3:#ff6b70; --c4:#ffa94d; --c5:#4cc38a;
  --c6:#e86bc7; --c7:#6aa6ff; --c8:#c99a5b; --c9:#a98bf0; --c10:#8b97a6;
  --av-fg:#121318;
  --shadow:0 1px 2px rgb(0 0 0 / .3), 0 8px 24px rgb(0 0 0 / .3);
  --shadow-lg:0 2px 6px rgb(0 0 0 / .4), 0 24px 60px rgb(0 0 0 / .55);
  color-scheme:dark;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.45 var(--font-body);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-radius:4px}
.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sd{width:16px;height:16px;flex:none}
.sp{flex:1}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--fg-3)}
.kbd{font-family:var(--font-mono);font-size:11px;padding:1px 5px;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:4px;color:var(--fg-2);background:var(--surface)}
.spark{color:var(--accent)}

/* ---------- shell ---------- */
#app{display:grid;grid-template-columns:252px minmax(0,1fr);height:100%}
#side{background:var(--surface-2);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#main{overflow:auto;min-width:0;display:flex;flex-direction:column}
#scrim{display:none}
.brand{display:flex;align-items:center;gap:10px;padding:14px 14px 10px}
.logo{width:28px;height:28px;border-radius:8px;background:var(--fg);color:var(--bg);display:grid;place-items:center;font:700 15px/1 var(--font-display)}
.brand b{font:700 17px/1 var(--font-display);letter-spacing:-.01em}
.brand small{display:block;color:var(--fg-3);font-size:11.5px;margin-top:2px}
.searchbtn{margin:4px 12px 4px;display:flex;align-items:center;gap:8px;padding:7px 10px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);color:var(--fg-3)}
.searchbtn:hover{border-color:var(--line-2);color:var(--fg-2)}
.searchbtn .kbd{margin-left:auto}
.askbtn{color:var(--accent);border-color:var(--accent-line);background:var(--accent-soft);margin-bottom:8px}
.askbtn:hover{color:var(--accent);border-color:var(--accent)}
.side-scroll{overflow:auto;flex:1;padding:4px 8px 12px;display:flex;flex-direction:column;gap:2px}
.nav{display:flex;align-items:center;gap:9px;width:100%;padding:6px 8px;border-radius:var(--r-sm);color:var(--fg-2);font-weight:500;min-height:32px}
.nav:hover{background:var(--surface-3);color:var(--fg)}
.nav.on{background:var(--surface);color:var(--fg);box-shadow:0 0 0 1px var(--line)}
.nav span.lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cnt{font:500 11.5px/1 var(--font-mono);color:var(--fg-3);font-variant-numeric:tabular-nums}
.cnt.alert{color:#fff;background:var(--danger);padding:3px 6px;border-radius:10px}
.cnt.acc{color:var(--accent-fg);background:var(--accent);padding:3px 6px;border-radius:10px}
.side-h{display:flex;align-items:center;gap:6px;padding:16px 8px 4px;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--fg-3);font-weight:600}
.side-h .ib{margin-left:auto}
.space-row{display:flex;align-items:center;gap:6px;padding:5px 6px;border-radius:var(--r-sm);color:var(--fg);font-weight:500;min-height:30px;width:100%}
.space-row:hover{background:var(--surface-3)}
.sq{width:18px;height:18px;border-radius:5px;background:var(--c);color:var(--av-fg);font:700 10px/18px var(--font-body);text-align:center;flex:none}
.nav.sub{padding-left:30px;font-weight:400}
.dotc{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.side-foot{border-top:1px solid var(--line);padding:10px 12px;display:flex;align-items:center;gap:8px}
.me-btn{display:flex;align-items:center;gap:8px;min-width:0;flex:1;padding:4px;border-radius:var(--r-sm)}
.me-btn:hover{background:var(--surface-3)}
.me-btn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.sync{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--fg-3);padding:0 14px 10px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block}
.sync.local i{background:var(--warn)}
.ib{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:var(--r-sm);color:var(--fg-3);flex:none}
.ib:hover{background:var(--surface-3);color:var(--fg)}
.ib.sm{width:22px;height:22px}
.ib.on{color:var(--accent)}
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:var(--r);border:1px solid var(--line-2);background:var(--surface);font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--fg-3)}
.btn:disabled{opacity:.55;cursor:default}
.btn.sm{height:28px;padding:0 10px;font-size:12.5px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--danger)}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--surface-3)}
.btn.ai{border-color:var(--accent-line);color:var(--accent);background:var(--accent-soft)}
.btn.ai:hover{border-color:var(--accent)}
.btn.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,var(--line-2))}
.btn.okf{background:var(--ok);border-color:var(--ok);color:var(--surface)}

/* ---------- page ---------- */
.page{padding:0 28px 48px;display:flex;flex-direction:column;gap:18px;min-height:100%}
.phd{position:sticky;top:0;z-index:5;background:var(--bg);padding:16px 0 0;display:flex;flex-direction:column;gap:10px}
.ph-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.crumbs{display:flex;align-items:center;gap:6px;color:var(--fg-3);font-size:12.5px}
.crumbs button:hover{color:var(--fg)}
h1{font:700 26px/1.15 var(--font-display);letter-spacing:-.02em;margin:0;text-wrap:balance;display:flex;align-items:center;gap:10px;min-width:0}
h2{font:600 15px/1.3 var(--font-body);margin:0;display:flex;align-items:center;gap:8px}
.lead{color:var(--fg-2);margin:0;max-width:75ch}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tab{display:flex;align-items:center;gap:7px;padding:8px 12px 9px;color:var(--fg-2);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab:hover{color:var(--fg)}
.tab.on{color:var(--fg);border-color:var(--accent)}
.tab .kbd{font-size:10px;padding:0 4px;opacity:.7}
.menu-btn{display:none}
.toolbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:2px 0 10px}
.tb{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:var(--r-sm);color:var(--fg-2);border:1px solid var(--line);background:var(--surface);white-space:nowrap;font-size:13px}
.tb:hover{color:var(--fg);border-color:var(--line-2)}
.tb b{font-weight:600;color:var(--fg)}
.tb.on{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}
.tb.on b{color:var(--accent)}
.pill{font:600 11px/1 var(--font-mono);background:var(--accent);color:var(--accent-fg);padding:3px 6px;border-radius:9px}
.tb-search{display:flex;align-items:center;gap:6px;height:30px;padding:0 10px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);color:var(--fg-3);margin-left:auto;min-width:200px}
.tb-search:focus-within{border-color:var(--accent)}
.tb-search input{border:0;outline:0;background:none;width:100%;min-width:0}
.fchips{display:flex;gap:6px;flex-wrap:wrap;margin-top:-4px}
.fchip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 4px 0 10px;border-radius:13px;background:var(--surface-3);font-size:12.5px}
.fchip button{display:grid;place-items:center;width:18px;height:18px;border-radius:50%}
.fchip button:hover{background:var(--line-2)}
.segc{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;background:var(--surface)}
.segc button{height:28px;padding:0 10px;font-size:12.5px;color:var(--fg-2)}
.segc button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}

/* chips & atoms */
.av{--c:var(--c0);width:22px;height:22px;border-radius:50%;background:var(--c);color:var(--av-fg);display:inline-grid;place-items:center;font:600 9.5px/1 var(--font-body);letter-spacing:.02em;flex:none;box-shadow:0 0 0 2px var(--surface)}
.av.lg{width:40px;height:40px;font-size:14px}
.av.md{width:28px;height:28px;font-size:11px}
.avs{display:inline-flex;align-items:center}
.avs .av+.av{margin-left:-6px}
.avs .more{font-size:11px;color:var(--fg-3);margin-left:4px}
.cchip{--c:var(--c0);display:inline-flex;align-items:center;gap:5px;max-width:100%;padding:2px 8px;border-radius:5px;font-size:12px;font-weight:500;background:color-mix(in srgb,var(--c) 15%,transparent);color:color-mix(in srgb,var(--c) 72%,var(--fg));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spill{display:inline-flex;align-items:center;gap:6px;padding:2px 9px 2px 6px;border-radius:5px;font-size:11.5px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;white-space:nowrap}
.spill.st-todo{background:color-mix(in srgb,var(--st-todo) 16%,transparent);color:var(--fg-2)}
.spill.st-progress{background:color-mix(in srgb,var(--st-progress) 16%,transparent);color:color-mix(in srgb,var(--st-progress) 80%,var(--fg))}
.spill.st-review{background:color-mix(in srgb,var(--st-review) 18%,transparent);color:color-mix(in srgb,var(--st-review) 75%,var(--fg))}
.spill.st-done{background:color-mix(in srgb,var(--st-done) 16%,transparent);color:color-mix(in srgb,var(--st-done) 78%,var(--fg))}
.flag{width:14px;height:14px}
.pr-urgent{color:var(--pr-urgent);fill:var(--pr-urgent)} .pr-high{color:var(--pr-high);fill:var(--pr-high)}
.pr-normal{color:var(--pr-normal);fill:var(--pr-normal)} .pr-low{color:var(--pr-low);fill:var(--pr-low)}
.pr-none{color:var(--fg-3)}
.type{overflow:hidden;text-overflow:ellipsis;font-size:12px;padding:2px 7px;border-radius:5px;border:1px solid var(--line-2);color:var(--fg-2);white-space:nowrap}
.is-over{color:var(--danger)!important;font-weight:500}
.is-today{color:var(--warn)!important;font-weight:500}
.is-soon{color:var(--fg)}
.meta-i{display:inline-flex;align-items:center;gap:3px;color:var(--fg-3);font-size:12px}
.meta-i .i{width:13px;height:13px}
.lockb{color:var(--warn)}
.mention{color:var(--accent);font-weight:500;background:var(--accent-soft);border-radius:4px;padding:0 3px}

/* ---------- list view ---------- */
.ltable{display:flex;flex-direction:column;gap:14px;min-width:0}
.grp{border-radius:var(--r);min-width:0}
.grp.over{background:var(--accent-soft)}
.grp-h{display:flex;align-items:center;gap:6px;padding:4px 0}
.grp-t{display:flex;align-items:center;gap:8px;padding:4px 6px;border-radius:var(--r-sm)}
.grp-t:hover{background:var(--surface-3)}
.grp-t .i{color:var(--fg-3);width:14px;height:14px}
.grp-n{font:500 12px var(--font-mono);color:var(--fg-3)}
.grp-h .ib{opacity:0}
.grp-h:hover .ib{opacity:1}
.rows{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow-x:auto}
.lrow{display:grid;grid-template-columns:54px minmax(220px,1fr) 150px 96px 104px 104px 130px;align-items:center;min-height:40px;border-bottom:1px solid var(--line);min-width:850px}
.lrow:last-child{border-bottom:0}
.lhead{min-height:30px;font-size:11.5px;color:var(--fg-3);font-weight:500}
.lhead>div{padding:0 8px}
.task{cursor:pointer}
.task:hover{background:var(--surface-2)}
.task.dragging{opacity:.4}
.lrow.sel{background:var(--accent-soft)}
.selc{display:flex;align-items:center}
.selb{display:grid;place-items:center;width:24px;height:40px;opacity:0}
.task:hover .selb,.selb.on,.has-sel .selb{opacity:1}
.chk{display:grid;place-items:center;width:30px;height:40px}
.chk:hover .sd{transform:scale(1.15)}
.c-name{display:flex;align-items:center;gap:8px;min-width:0;padding-right:8px}
.c-name .tt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.is-done .tt{color:var(--fg-3);text-decoration:line-through;text-decoration-color:var(--line-2)}
.cell{display:flex;align-items:center;gap:6px;height:40px;padding:0 8px;min-width:0;color:var(--fg-2);font-size:13px;border-left:1px solid transparent}
.cell:hover{background:var(--surface-3);border-left-color:var(--line)}
.cell .ph{color:var(--fg-3);opacity:0;display:inline-flex}
.task:hover .cell .ph{opacity:.7}
.addrow{display:flex;align-items:center;gap:8px;padding:0 10px 0 36px;min-height:38px;color:var(--fg-3)}
.addrow input{border:0;background:none;outline:0;flex:1;min-width:0;height:36px}
.addrow input::placeholder{color:var(--fg-3)}
.addrow:focus-within{background:var(--surface-2)}
.morebtn{padding:8px 36px;color:var(--accent);font-size:13px;font-weight:500;border-bottom:1px solid var(--line);width:100%}

/* ---------- board ---------- */
.board{display:flex;gap:12px;overflow-x:auto;align-items:flex-start;padding-bottom:16px;min-height:60vh}
.col{flex:0 0 282px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;max-height:calc(100vh - 210px)}
.col.over{border-color:var(--accent);background:var(--accent-soft)}
.col-h{display:flex;align-items:center;gap:8px;padding:10px 10px 8px 12px;font-weight:600;font-size:13px}
.col-h .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.col-b{display:flex;flex-direction:column;gap:8px;padding:2px 8px 8px;overflow:auto;min-height:24px}
.col-add{margin:0 8px 8px;padding:7px 8px;border-radius:var(--r-sm);color:var(--fg-3);display:flex;align-items:center;gap:6px;font-size:13px}
.col-add:hover{background:var(--surface-3);color:var(--fg)}
.col-hint{font-size:12px;color:var(--fg-3);padding:6px 6px 2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 11px;display:flex;flex-direction:column;gap:8px;cursor:pointer;box-shadow:0 1px 1px rgb(0 0 0 / .03)}
.card:hover{border-color:var(--line-2);box-shadow:var(--shadow)}
.card.dragging{opacity:.4}
.card-t{display:flex;gap:7px;align-items:flex-start;font-weight:500;line-height:1.35}
.card-t .sd{margin-top:1px}
.card-m{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--fg-2)}
.card-m .sp{min-width:4px}
.subbar{height:3px;border-radius:2px;background:var(--surface-3);overflow:hidden}
.subbar i{display:block;height:100%;background:var(--st-done)}

/* ---------- timeline ---------- */
.tl{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.tl-scroll{overflow:auto;max-height:calc(100vh - 250px)}
.tl-inner{position:relative}
.tl-head{position:sticky;top:0;z-index:5;display:flex;background:var(--surface-2);border-bottom:1px solid var(--line)}
.tl-hname{position:sticky;left:0;z-index:6;width:var(--tln);flex:none;background:var(--surface-2);border-right:1px solid var(--line);padding:6px 12px;font-size:12px;color:var(--fg-3);display:flex;align-items:flex-end}
.tl-htrack{position:relative;height:46px;flex:none}
.tl-mon{position:absolute;top:5px;font-size:12px;font-weight:600;padding-left:6px;white-space:nowrap;text-transform:capitalize;border-left:1px solid var(--line-2)}
.tl-day{position:absolute;bottom:5px;font:500 10.5px var(--font-mono);color:var(--fg-3);text-align:center}
.tl-day.today{color:var(--accent);font-weight:700}
.tl-body{position:relative}
.tl-bg{position:absolute;top:0;bottom:0;pointer-events:none}
.tl-we{position:absolute;top:0;bottom:0;background:var(--surface-2)}
.tl-today{position:absolute;top:0;bottom:0;width:2px;background:var(--accent);opacity:.8}
.tl-row{display:flex;height:36px;border-bottom:1px solid var(--line);position:relative}
.tl-row.g{height:34px;background:color-mix(in srgb,var(--surface-2) 60%,transparent)}
.tl-name{position:sticky;left:0;z-index:4;width:var(--tln);flex:none;background:var(--surface);border-right:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:0 10px;min-width:0;cursor:pointer;font-size:13px}
.tl-name:hover{background:var(--surface-2)}
.tl-row.g .tl-name{background:var(--surface-2);font-weight:600;cursor:default}
.tl-name span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.tl-track{position:relative;flex:none}
.tl-track.undated{cursor:copy}
.tl-track.undated:hover{background:color-mix(in srgb,var(--accent-soft) 40%,transparent)}
.bar{position:absolute;top:6px;height:24px;border-radius:6px;background:color-mix(in srgb,var(--sc) 24%,var(--surface));border:1px solid color-mix(in srgb,var(--sc) 60%,transparent);display:flex;align-items:center;font-size:12px;cursor:grab;touch-action:none;user-select:none;z-index:2;min-width:10px}
.bar .lbl{padding:0 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;color:var(--fg);display:flex;align-items:center;gap:4px}
.bar .lbl .i{width:12px;height:12px;color:var(--warn)}
.bar .bh{width:7px;align-self:stretch;cursor:ew-resize;flex:none;border-radius:5px}
.bar:hover .bh{background:color-mix(in srgb,var(--sc) 45%,transparent)}
.bar.dragging{cursor:grabbing;box-shadow:var(--shadow);z-index:6}
.bar.late{border-color:var(--danger);border-width:1.5px}
.tl-arrows{position:absolute;top:0;pointer-events:none;z-index:3;overflow:visible}
.tl-arrows path{fill:none;stroke:var(--fg-3);stroke-width:1.4}
.tl-arrows path.bad{stroke:var(--danger)}

/* ---------- calendar ---------- */
.calwrap{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:14px;align-items:start}
.cal-h{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.cal-h h2{font:700 18px var(--font-display);text-transform:capitalize;min-width:150px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--line);gap:1px}
.cal-wd{background:var(--surface-2);padding:6px 8px;font-size:11.5px;color:var(--fg-3);font-weight:500;text-transform:uppercase;letter-spacing:.05em}
.day{background:var(--surface);min-height:108px;padding:5px;display:flex;flex-direction:column;gap:3px;position:relative;min-width:0}
.day.out{background:var(--surface-2)}
.day.out .dn{color:var(--fg-3)}
.day.over{background:var(--accent-soft)}
.dn{font:500 12px var(--font-mono);color:var(--fg-2);padding:2px 4px;display:flex;align-items:center;justify-content:space-between}
.day.today .dn b{background:var(--accent);color:var(--accent-fg);border-radius:10px;padding:1px 6px}
.dn .ib{opacity:0;width:20px;height:20px}
.day:hover .dn .ib{opacity:1}
.cchev{display:flex;align-items:center;gap:5px;padding:2px 5px;border-radius:4px;font-size:12px;background:var(--surface-2);border-left:3px solid var(--sc);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer;min-width:0}
.cchev span{overflow:hidden;text-overflow:ellipsis}
.cchev:hover{background:var(--surface-3)}
.cchev.done{opacity:.55;text-decoration:line-through}
.cal-more{font-size:11.5px;color:var(--fg-3);padding:0 5px}
.undated{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:6px}
.undated h3{margin:0 0 4px;font-size:13px}
.agenda{display:none}

/* ---------- panels / dashboard ---------- */
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
.grid3{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel-h{display:flex;align-items:center;gap:8px}
.panel-h h2{flex:1}
.panel-h .link{color:var(--accent);font-size:12.5px;font-weight:500}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;text-align:left;min-width:0}
button.kpi:hover{border-color:var(--line-2);box-shadow:var(--shadow)}
.kpi .k{font-size:12px;color:var(--fg-2);display:flex;align-items:center;gap:6px}
.kpi .v{font:700 30px/1.1 var(--font-display);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi .s{font-size:12px;color:var(--fg-3)}
.kpi.bad .v{color:var(--danger)}
.kpi.warn .v{color:var(--warn)}
.bars{display:flex;flex-direction:column;gap:10px}
.bar-row{display:grid;grid-template-columns:150px minmax(0,1fr) 64px;gap:10px;align-items:center;text-align:left;border-radius:6px;padding:2px 4px}
button.bar-row:hover{background:var(--surface-2)}
.bar-row .who{display:flex;align-items:center;gap:8px;min-width:0}
.bar-row .who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sbar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--surface-3)}
.sbar i{display:block;height:100%}
.sbar i+i{box-shadow:-1px 0 0 var(--surface)}
.bar-row .num{font:500 12.5px var(--font-mono);text-align:right;color:var(--fg-2);white-space:nowrap}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--fg-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.mini{display:flex;flex-direction:column}
.mrow{display:flex;align-items:center;gap:10px;padding:7px 6px;border-radius:var(--r-sm);cursor:pointer;min-height:38px;min-width:0}
.mrow:hover{background:var(--surface-2)}
.mrow .tt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .due{font-size:12.5px;color:var(--fg-2);white-space:nowrap}
.mrow .cchip{max-width:140px}
.mrow + .mrow{border-top:1px solid var(--line)}
.why{font-size:12px;color:var(--fg-3);padding:0 6px 6px 38px;margin-top:-4px}
.done-btn{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line-2);display:grid;place-items:center;color:transparent;flex:none}
.done-btn .i{width:13px;height:13px;stroke-width:2.4}
.done-btn:hover{border-color:var(--ok);color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent)}
.sec-t{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--fg-2);padding:10px 6px 4px;text-transform:uppercase;letter-spacing:.06em}
.sec-t.bad{color:var(--danger)}
.sec-t.new{color:var(--accent)}
.sec-t .btn{margin-left:auto;text-transform:none;letter-spacing:0}
.empty{color:var(--fg-3);font-size:13px;padding:14px 6px;text-align:center}
.feed{display:flex;flex-direction:column;gap:2px}
.fitem{display:flex;gap:10px;padding:7px 6px;border-radius:var(--r-sm);font-size:13px;cursor:pointer;align-items:flex-start}
.fitem:hover{background:var(--surface-2)}
.fitem p{margin:0;min-width:0;color:var(--fg-2)}
.fitem p b{color:var(--fg);font-weight:500}
.fitem time{font-size:11.5px;color:var(--fg-3);display:block}

/* clients & team */
.cboard .col{flex-basis:300px}
.ccard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px;cursor:pointer}
.ccard:hover{border-color:var(--line-2);box-shadow:var(--shadow)}
.ccard.dragging{opacity:.4}
.ccard-h{display:flex;align-items:center;gap:8px;font-weight:600}
.ccard-h .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cstats{display:flex;gap:14px;font-size:12px;color:var(--fg-2);flex-wrap:wrap}
.cstats b{font:600 13px var(--font-mono);color:var(--fg)}
.cstats .bad b{color:var(--danger)}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.mcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:14px;cursor:pointer;text-align:left}
.mcard:hover{border-color:var(--line-2);box-shadow:var(--shadow)}
.mcard-h{display:flex;align-items:center;gap:12px}
.mcard-h div{min-width:0;flex:1}
.mcard-h b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mcard-h small{color:var(--fg-3)}
.mnums{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.mnums div{display:flex;flex-direction:column}
.mnums b{font:700 20px/1.1 var(--font-display);font-variant-numeric:tabular-nums}
.mnums span{font-size:11px;color:var(--fg-3)}
.mnums .bad b{color:var(--danger)}
.strip{display:grid;grid-template-columns:repeat(14,1fr);gap:3px}
.strip i{height:22px;border-radius:3px;background:var(--surface-3)}
.strip i[data-n="1"]{background:color-mix(in srgb,var(--accent) 30%,var(--surface-3))}
.strip i[data-n="2"]{background:color-mix(in srgb,var(--accent) 55%,var(--surface-3))}
.strip i[data-n="3"]{background:color-mix(in srgb,var(--accent) 80%,var(--surface-3))}
.strip i.we{opacity:.5}
.strip-l{display:flex;justify-content:space-between;font-size:11px;color:var(--fg-3);margin-top:-8px}
.wl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.wl table{border-collapse:collapse;width:100%;min-width:820px}
.wl th,.wl td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;font-size:13px;vertical-align:middle}
.wl tr:last-child td{border-bottom:0}
.wl th{font-size:11.5px;color:var(--fg-3);font-weight:500;background:var(--surface-2);white-space:nowrap}
.wl th.cur{color:var(--accent)}
.wl .who{display:flex;align-items:center;gap:8px;white-space:nowrap}
.wl .who small{color:var(--fg-3);font-size:11.5px}
.wlc{display:flex;flex-direction:column;gap:4px;width:100%;min-width:84px;padding:5px 6px;border-radius:6px;text-align:left}
.wlc:hover{background:var(--surface-2)}
.wlc b{font:600 13px var(--font-mono)}
.wlc small{color:var(--fg-3);font-size:11px;font-family:var(--font-mono)}
.wlbar{height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden}
.wlbar i{display:block;height:100%;background:var(--ok)}
.wlc.full .wlbar i{background:var(--warn)}
.wlc.over .wlbar i{background:var(--danger)}
.wlc.over b{color:var(--danger)}
.wlc.zero b{color:var(--fg-3);font-weight:400}
.alerts{display:flex;flex-direction:column;gap:6px}
.alert-row{display:flex;align-items:center;gap:10px;font-size:13px;padding:8px 10px;border-radius:var(--r-sm);background:var(--surface);border:1px solid var(--line)}
.alert-row.bad{border-color:color-mix(in srgb,var(--danger) 40%,var(--line))}
.alert-row.good{border-color:color-mix(in srgb,var(--ok) 40%,var(--line))}
.alert-row .i{color:var(--fg-3)}
.alert-row.bad .i{color:var(--danger)}
.alert-row.good .i{color:var(--ok)}
.alert-row span{flex:1;min-width:0}

/* project status */
.pst{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:14px;font-size:12.5px;font-weight:600;border:1px solid var(--line-2);background:var(--surface);white-space:nowrap}
.pst i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.pst-on{--c:var(--ok)} .pst-risk{--c:var(--warn)} .pst-off{--c:var(--danger)} .pst-done{--c:var(--accent)} .pst-none{--c:var(--fg-3);font-weight:500;color:var(--fg-2)}
.pst small{font-weight:400;color:var(--fg-3)}
.psrow{display:flex;gap:10px;align-items:flex-start;padding:8px 6px;border-radius:var(--r-sm);cursor:pointer}
.psrow:hover{background:var(--surface-2)}
.psrow div{flex:1;min-width:0}
.psrow b{font-weight:600;display:block}
.psrow p{margin:2px 0 0;color:var(--fg-2);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

/* inbox */
.nlist{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.nitem{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.nitem:last-child{border-bottom:0}
.nitem:hover{background:var(--surface-2)}
.nitem.unread{background:color-mix(in srgb,var(--accent-soft) 50%,var(--surface))}
.nitem .ndot{width:8px;height:8px;border-radius:50%;background:var(--accent);margin-top:10px;flex:none}
.nitem .ndot.r{background:transparent}
.nkind{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--surface-3);color:var(--fg-2);flex:none;position:relative}
.nkind .av{position:absolute;right:-6px;bottom:-4px;width:18px;height:18px;font-size:8px}
.nk-approval{background:color-mix(in srgb,var(--st-review) 20%,var(--surface));color:var(--st-review)}
.nk-approved{background:color-mix(in srgb,var(--ok) 18%,var(--surface));color:var(--ok)}
.nk-mention{background:var(--accent-soft);color:var(--accent)}
.nk-unblocked{background:color-mix(in srgb,var(--ok) 18%,var(--surface));color:var(--ok)}
.nk-changes{background:color-mix(in srgb,var(--danger) 14%,var(--surface));color:var(--danger)}
.nbody{flex:1;min-width:0}
.nbody p{margin:0;color:var(--fg-2)}
.nbody p b{color:var(--fg);font-weight:500}
.nt{display:flex;align-items:center;gap:8px;margin-top:4px;font-weight:500;min-width:0}
.nt span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nitem time{font-size:11.5px;color:var(--fg-3);white-space:nowrap;margin-top:2px}
.nitem .ib{opacity:0}
.nitem:hover .ib{opacity:1}

/* ---------- drawer ---------- */
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(600px,100%);background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--shadow-lg);z-index:40;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.dr-top{display:flex;align-items:center;gap:6px;padding:10px 12px 10px 16px;border-bottom:1px solid var(--line)}
.dr-top .crumbs{flex:1;min-width:0;overflow:hidden;white-space:nowrap}
.dr-body{overflow:auto;padding:18px 20px 40px;display:flex;flex-direction:column;gap:18px}
.dt-title{font:700 22px/1.25 var(--font-display);letter-spacing:-.01em;border:0;background:none;resize:none;width:100%;outline:0;padding:4px 6px;margin:0 -6px;border-radius:6px;overflow:hidden}
.dt-title:hover,.dt-title:focus{background:var(--surface-2)}
.props{display:grid;grid-template-columns:110px minmax(0,1fr) 110px minmax(0,1fr);gap:2px 8px;align-items:center}
.pl{color:var(--fg-3);font-size:12.5px;display:flex;align-items:center;gap:7px}
.pl .i{width:14px;height:14px}
.pv{display:flex;align-items:center;gap:6px;min-height:34px;padding:0 8px;border-radius:var(--r-sm);font-size:13px;min-width:0}
button.pv:hover{background:var(--surface-2)}
.pv input{border:0;background:none;outline:0;width:100%;min-width:0;height:30px}
.pv .dash{color:var(--fg-3)}
.dr-sec{display:flex;flex-direction:column;gap:8px}
.dr-sec h3{margin:0;font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px}
.dr-sec h3 .muted{font-weight:400}
.desc{width:100%;min-height:84px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:10px 12px;resize:vertical;outline:0;line-height:1.5}
.desc:focus{border-color:var(--accent)}
.subs{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r)}
.sub{display:flex;align-items:center;gap:8px;padding:0 6px 0 10px;min-height:36px;border-bottom:1px solid var(--line)}
.sub:last-child{border-bottom:0}
.sub input[type=checkbox]{accent-color:var(--ok);width:15px;height:15px}
.sub input.sub-t{flex:1;border:0;background:none;outline:0;min-width:0;height:34px}
.sub.done input.sub-t{text-decoration:line-through;color:var(--fg-3)}
.sub .ib{opacity:0}
.sub:hover .ib{opacity:1}
.comments{display:flex;flex-direction:column;gap:12px}
.cm{display:flex;gap:10px}
.cm-b{flex:1;min-width:0}
.cm-b header{display:flex;gap:8px;align-items:baseline;font-size:12.5px}
.cm-b header b{font-weight:600}
.cm-b header time{color:var(--fg-3);font-size:11.5px}
.cm-b p{margin:2px 0 0;white-space:pre-wrap;word-wrap:break-word}
.composer{display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);border-radius:var(--r);padding:8px 10px}
.composer:focus-within{border-color:var(--accent)}
.composer textarea{border:0;outline:0;background:none;resize:none;min-height:44px;width:100%}
.composer footer{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--fg-3);flex-wrap:wrap}
.log{font-size:12.5px;color:var(--fg-2);display:flex;flex-direction:column;gap:4px;padding-top:6px}
.log time{color:var(--fg-3);font-family:var(--font-mono);font-size:11px;margin-right:6px}
details summary{cursor:pointer;color:var(--fg-2);font-size:13px;font-weight:500}
.approval{border:1px solid color-mix(in srgb,var(--st-review) 45%,var(--line));background:color-mix(in srgb,var(--st-review) 9%,var(--surface));border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.approval .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.approval .who{display:flex;align-items:center;gap:8px;font-size:13px}
.blocked-note{display:flex;gap:8px;align-items:center;font-size:13px;padding:10px 12px;border-radius:10px;background:color-mix(in srgb,var(--warn) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--warn) 40%,var(--line))}
.blocked-note .i{color:var(--warn)}
.deps{display:flex;flex-direction:column;gap:6px}
.dep{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--fg-3);padding:5px 6px 5px 10px;border:1px solid var(--line);border-radius:var(--r-sm)}
.dep.open{border-color:color-mix(in srgb,var(--warn) 45%,var(--line))}
.dep .dt{display:flex;align-items:center;gap:6px;font-weight:500;color:var(--fg);min-width:0;flex:1;font-size:13px}
.dep .dt span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.followers{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--fg-3);flex-wrap:wrap;border-top:1px solid var(--line);padding-top:14px}

/* ai */
.aibox{border:1px solid var(--accent-line);background:color-mix(in srgb,var(--accent-soft) 55%,var(--surface));border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;font-size:13.5px}
.aibox header{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--accent);font-size:12.5px}
.aibox .txt{white-space:pre-wrap;line-height:1.55;color:var(--fg)}
.thinking{color:var(--fg-3);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
.airow{display:flex;gap:6px;flex-wrap:wrap}
.sugg{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--fg-3)}
.schip{display:inline-flex;align-items:center;gap:6px;min-height:26px;padding:3px 10px;border-radius:13px;border:1px dashed var(--accent-line);color:var(--accent);font-size:12.5px;text-align:left}
.schip:hover{background:var(--accent-soft)}
.schip .i{width:13px;height:13px}
.warnline{display:flex;gap:6px;align-items:center;color:var(--warn);font-size:12.5px}
.warnline .i{width:14px;height:14px}
.aisub{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:13px}
.aisub input{accent-color:var(--accent)}
.extract{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r)}
.exrow{display:flex;gap:10px;align-items:flex-start;padding:10px;border-bottom:1px solid var(--line)}
.exrow:last-child{border-bottom:0}
.exrow input[type=checkbox]{margin-top:4px;accent-color:var(--accent)}
.exrow .exb{flex:1;min-width:0}
.exrow input.ext{width:100%;border:0;background:none;outline:0;font-weight:500;padding:2px 0}
.exrow .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;font-size:12px;color:var(--fg-2);align-items:center}
.ask-a{white-space:pre-wrap;line-height:1.6;font-size:14px;background:var(--surface-2);border-radius:10px;padding:12px 14px}

/* bulk */
#bulk{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70;background:var(--fg);color:var(--bg);border-radius:12px;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:2px;padding:6px 6px 6px 14px;max-width:calc(100% - 32px);overflow-x:auto}
#bulk b{margin-right:8px;white-space:nowrap;font-weight:600}
#bulk button{color:var(--bg);padding:6px 10px;border-radius:8px;white-space:nowrap;display:flex;gap:6px;align-items:center;font-size:13px}
#bulk button:hover{background:color-mix(in srgb,var(--bg) 18%,transparent)}

/* ---------- popover / modal / toast ---------- */
#pop{position:fixed;z-index:80;background:var(--surface);border:1px solid var(--line-2);border-radius:10px;box-shadow:var(--shadow-lg);width:260px;max-height:min(420px,70vh);display:flex;flex-direction:column;overflow:hidden}
.pop-s{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line);color:var(--fg-3)}
.pop-s input{border:0;outline:0;background:none;flex:1;min-width:0}
.pop-l{overflow:auto;padding:4px;display:flex;flex-direction:column}
.opt{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:var(--r-sm);min-height:32px;font-size:13px;width:100%}
.opt:hover,.opt.hl{background:var(--surface-2)}
.opt .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ck{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--line-2);display:grid;place-items:center;flex:none;color:transparent;background:var(--surface)}
.ck.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.ck .i{width:12px;height:12px;stroke-width:2.6}
.opt.cur{font-weight:600}
.opt .hint{font-size:11.5px;color:var(--fg-3)}
.pop-sep{height:1px;background:var(--line);margin:4px 2px}
.pop-t{font-size:11px;color:var(--fg-3);text-transform:uppercase;letter-spacing:.06em;padding:8px 8px 4px;font-weight:600}
.pop-date{padding:8px;border-top:1px solid var(--line)}
.pop-date input{width:100%;height:32px;border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--surface);padding:0 8px}
#modal{position:fixed;inset:0;z-index:60;display:grid;place-items:start center;padding:8vh 16px 16px}
.mback{position:absolute;inset:0;background:rgb(10 10 20 / .45)}
.mbox{position:relative;background:var(--surface);border:1px solid var(--line-2);border-radius:14px;box-shadow:var(--shadow-lg);width:min(640px,100%);max-height:84vh;display:flex;flex-direction:column;overflow:hidden}
.mbox-settings{width:min(800px,100%)}
.mbox-confirm,.mbox-name{width:min(420px,100%)}
.mh{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.mh h2{flex:1;font:700 17px var(--font-display)}
.mb{padding:16px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.mf{display:flex;align-items:center;gap:8px;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.qa-title{font:600 18px/1.3 var(--font-body);border:0;outline:0;background:none;width:100%;padding:4px 0}
.qa-hint{font-size:12px;color:var(--fg-3);display:flex;gap:10px;flex-wrap:wrap}
.qa-hint code{font-family:var(--font-mono);color:var(--fg-2);background:var(--surface-2);padding:0 4px;border-radius:3px}
.qa-chips{display:flex;gap:6px;flex-wrap:wrap}
.qchip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border:1px solid var(--line-2);border-radius:var(--r-sm);font-size:13px;color:var(--fg-2);max-width:100%}
.qchip:hover{border-color:var(--fg-3);color:var(--fg)}
.qchip.set{color:var(--fg);border-color:var(--accent-line);background:var(--accent-soft)}
.qchip.parsed{box-shadow:0 0 0 2px var(--accent-line)}
.qa-desc{width:100%;border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;min-height:64px;resize:vertical;background:var(--surface);outline:0}
.qa-desc:focus{border-color:var(--accent)}
.chkline{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--fg-2)}
.pal-in{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);color:var(--fg-3)}
.pal-in input{flex:1;border:0;outline:0;background:none;font-size:16px;color:var(--fg)}
.pal-res{overflow:auto;padding:6px;max-height:60vh}
.pal-res .opt{min-height:38px}
.pal-res .opt .hint{margin-left:auto}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.field .lab{font-size:12.5px;color:var(--fg-2);font-weight:500}
.inp{height:36px;border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--surface);padding:0 10px;outline:0;width:100%}
.inp:focus{border-color:var(--accent)}
textarea.inp{height:auto;min-height:80px;padding:8px 10px;resize:vertical;line-height:1.5}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.sw{width:24px;height:24px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 2px var(--surface)}
.sw.on{outline:2px solid var(--fg);outline-offset:1px}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{padding:6px 10px;border-radius:var(--r-sm);border:1px solid var(--line-2);font-size:13px}
.seg button.on{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent);font-weight:600}
.mtabs{display:flex;gap:2px;padding:0 16px;border-bottom:1px solid var(--line);overflow-x:auto}
.srow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.srow .inp{flex:1;min-width:140px}
.srow .inp.cap{flex:0 0 76px;min-width:0}
.srow .sw{width:18px;height:18px}
.list-row{display:flex;align-items:center;gap:8px;padding-left:28px}
.helpgrid{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;align-items:center;font-size:13px}
.rule{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:10px}
.rule div{flex:1;min-width:0}
.rule p{margin:2px 0 0;font-size:12.5px;color:var(--fg-2)}
.rule .nm{font-weight:600}
.switch{width:34px;height:20px;border-radius:10px;background:var(--line-2);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--surface);transition:left .15s}
.switch.on{background:var(--ok)}
.switch.on::after{left:16px}
.recipes{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.recipe{border:1px dashed var(--line-2);border-radius:10px;padding:10px 12px;font-size:12.5px;color:var(--fg-2);text-align:left}
.recipe b{display:block;color:var(--fg);font-size:13px;margin-bottom:2px}
.recipe:hover{border-color:var(--accent);background:var(--accent-soft)}
.rb{display:flex;flex-direction:column;gap:8px;padding:12px;border:1px solid var(--line);border-radius:10px}
.rb-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rb-row select,.rb-row input{height:34px;border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--surface);padding:0 8px;max-width:100%}
.rb-lbl{font-size:11px;font-weight:600;color:var(--fg-3);text-transform:uppercase;letter-spacing:.07em}
#toasts{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:calc(100% - 32px)}
body.bulk-on #toasts{bottom:calc(76px + env(safe-area-inset-bottom,0px))}
.toast{pointer-events:auto;display:flex;align-items:center;gap:12px;background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:10px;box-shadow:var(--shadow-lg);font-size:13px;animation:tin .18s ease-out}
.toast button{font-weight:600;color:var(--bg);text-decoration:underline;text-underline-offset:3px}
@keyframes tin{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
.banner>span:not(.sp){flex:1 1 240px;min-width:0}
.banner{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--r);background:var(--accent-soft);color:var(--fg);font-size:13px;border:1px solid var(--accent-line);flex-wrap:wrap}
.banner.warn{background:color-mix(in srgb,var(--warn) 12%,var(--surface));border-color:color-mix(in srgb,var(--warn) 35%,var(--surface))}
.onb{max-width:640px;margin:8vh auto 0;display:flex;flex-direction:column;gap:18px}
.onb h1{font-size:34px}
.steps{display:flex;flex-direction:column;gap:10px;counter-reset:s}
.step{display:flex;gap:14px;align-items:center;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.step::before{counter-increment:s;content:counter(s);font:700 15px/28px var(--font-display);width:28px;height:28px;border-radius:50%;background:var(--surface-3);text-align:center;flex:none}
.step.ok::before{content:"✓";background:var(--ok);color:var(--surface)}
.step div{flex:1;min-width:0}
.step p{margin:2px 0 0;color:var(--fg-2);font-size:13px}
.loading{display:grid;place-items:center;height:100%;color:var(--fg-3);gap:8px}

/* ---------- responsive ---------- */
@media (max-width: 1100px){
  .kpis{grid-template-columns:repeat(3,minmax(0,1fr))}
  .grid3,.grid2{grid-template-columns:minmax(0,1fr)}
  .calwrap{grid-template-columns:minmax(0,1fr)}
}
@media (max-width: 860px){
  #app{grid-template-columns:minmax(0,1fr)}
  #side{position:fixed;top:0;bottom:0;left:0;width:280px;z-index:50;transform:translateX(-100%);transition:transform .2s ease;padding-top:env(safe-area-inset-top,0px)}
  body.side-open #side{transform:none;box-shadow:var(--shadow-lg)}
  body.side-open #scrim{display:block;position:fixed;inset:0;background:rgb(10 10 20 / .4);z-index:45}
  .menu-btn{display:inline-grid}
  .page{padding:0 16px 40px}
  .tb-search{margin-left:0;flex:1 1 100%}
  .props{grid-template-columns:100px minmax(0,1fr)}
  :root{--tln:170px}
}
@media (max-width: 700px){
  .lrow{grid-template-columns:54px minmax(0,1fr) 72px 84px;min-width:0}
  .lrow .c-client,.lrow .c-pri,.lrow .c-type{display:none}
  .selb{opacity:.6}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cal,.cal-h,.undated{display:none}
  .agenda{display:flex;flex-direction:column;gap:12px}
  .bar-row{grid-template-columns:100px minmax(0,1fr) 54px}
  .mrow .cchip{display:none}
  h1{font-size:22px}
  #modal{padding-top:4vh}
  :root{--tln:130px}
  .tl-name .avs,.tl-hname{font-size:0}
  .tl-name .avs{display:none}
  .tl-scroll{max-height:70vh}
}

<script>
/* ================= costanti ================= */
const STATUSES=[{id:'todo',label:'Da fare'},{id:'progress',label:'In corso'},{id:'review',label:'In revisione'},{id:'done',label:'Completato'}];
const ST=Object.fromEntries(STATUSES.map(s=>[s.id,s]));
const PRIOS=[{id:'urgent',label:'Urgente'},{id:'high',label:'Alta'},{id:'normal',label:'Normale'},{id:'low',label:'Bassa'}];
const PR=Object.fromEntries(PRIOS.map(p=>[p.id,p]));
const PRANK={urgent:0,high:1,normal:2,low:3};
const CSTAT=[{id:'onboarding',label:'Onboarding'},{id:'active',label:'Attivo'},{id:'paused',label:'In pausa'},{id:'stopped',label:'Concluso'}];
const CS=Object.fromEntries(CSTAT.map(s=>[s.id,s]));
const PST={on:'In linea',risk:'A rischio',off:'Fuori strada',done:'Completato'};
const DEFAULT_TYPES=['PED','Rebranding','Sito Web','ADV','Strategia di comunicazione','Social','Shooting','Grafica','Evento'];
const GROUPS={status:'Stato',client:'Cliente',assignee:'Persona',priority:'Priorità',due:'Scadenza',list:'Elenco'};
const SORTS={due:'Scadenza',priority:'Priorità',title:'Nome A–Z',updated:'Ultima modifica'};
const RECUR={daily:'Ogni giorno',weekly:'Ogni settimana',monthly:'Ogni mese'};
const BUCKETS=[['overdue','Scadute'],['today','Oggi'],['week','Prossimi 7 giorni'],['later','Più avanti'],['none','Senza data']];
const COLLS=['spaces','lists','clients','members','tasks','notifs','rules','templates'];
const WD=['dom','lun','mar','mer','gio','ven','sab'];
const WDL=['domenica','lunedì','martedì','mercoledì','giovedì','venerdì','sabato'];
const MO=['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];

const Store={
  db:null, q:{},
  put(c,id,data){if(!canWrite())return;const d={...data};delete d.id;D[c].set(id,{...d,id});scheduleRender();this.w(c,id,'set',d)},
  patch(c,id,p){if(!canWrite())return;const cur=D[c].get(id);if(!cur)return;D[c].set(id,{...cur,...p});scheduleRender();this.w(c,id,'update',p)},
  remove(c,id){if(!canWrite())return;D[c].delete(id);scheduleRender();this.w(c,id,'delete')},
  w(c,id,op,data){
    if(st.mode==='local'){saveLocal();return}
    const ref=this.db.collection(c).doc(id);const key=c+'/'+id;
    this.q[key]=(this.q[key]||Promise.resolve()).then(()=>op==='delete'?ref.delete():op==='set'?ref.set(data):ref.update(data)).catch(e=>{
      if(e&&e.code==='invalid_argument'&&op!=='update'){st.readOnly=true;scheduleRender()}
      toast(errMsg(e));

  }
};

function scopeTasks(r){let t=arr('tasks');if(r.scope==='list')t=t.filter(x=>x.listId===r.id);else if(r.scope==='client')t=t.filter(x=>x.clientId===r.id);else if(r.scope==='member')t=t.filter(x=>(x.assignees||[]).includes(r.id));return t}
function applyFilters(t,keepDone){const f=st.filters;const q=norm(f.q);
  return t.filter(x=>{
    if(st.hideDone&&!keepDone&&x.status==='done')return false;
    if(st.mine&&st.me&&!(x.assignees||[]).includes(st.me))return false;
    if(f.assignees.length&&!f.assignees.some(a=>a==='none'?!(x.assignees||[]).length:(x.assignees||[]).includes(a)))return false;
    if(f.clients.length&&!f.clients.includes(x.clientId||'none'))return false;
    if(f.priorities.length&&!f.priorities.includes(x.priority||'none'))return false;
    if(q){const c=get('clients',x.clientId);if(!norm(x.title+' '+(x.description||'')+' '+(c?.name||'')+' '+(x.type||'')).includes(q))return false}
    return true})}
function nFilters(){const f=st.filters;return f.assignees.length+f.clients.length+f.priorities.length}
function sortTasks(a){const s=st.sort;return a.sort((x,y)=>{
  if(s==='title')return (x.title||'').localeCompare(y.title||'','it');
  if(s==='updated')return (y.updatedAt||0)-(x.updatedAt||0);
  if(s==='priority'){const d=(PRANK[x.priority]??9)-(PRANK[y.priority]??9);if(d)return d}
  return (x.due||'9999').localeCompare(y.due||'9999')||(PRANK[x.priority]??9)-(PRANK[y.priority]??9)||(x.createdAt||0)-(y.createdAt||0)})}
function groupTasks(tasks,by,board){
  const G=[];const push=(key,label,head,fn,pre)=>G.push({key,label,head,tasks:tasks.filter(fn),preset:pre});
  if(by==='status')STATUSES.forEach(s=>push(s.id,s.label,statusDot(s.id),t=>t.status===s.id,{status:s.id}));
  else if(by==='priority'){PRIOS.forEach(p=>push(p.id,p.label,prioFlag(p.id),t=>t.priority===p.id,{priority:p.id}));push('none','Nessuna priorità',prioFlag(null),t=>!PR[t.priority],{priority:null})}
  else if(by==='client'){const used=new Set(tasks.map(t=>t.clientId));sortedClients().filter(c=>used.has(c.id)).forEach(c=>push(c.id,c.name,dotC(c.color),t=>t.clientId===c.id,{clientId:c.id}));push('none','Senza cliente',dotC(0),t=>!t.clientId||!D.clients.has(t.clientId),{clientId:null})}
  else if(by==='assignee'){members().forEach(m=>push(m.id,m.name,avatar(m),t=>(t.assignees||[]).includes(m.id),{assignees:[m.id]}));push('none','Non assegnate',`<span class="av">–</span>`,t=>!(t.assignees||[]).some(id=>D.members.has(id)),{assignees:[]})}
  else if(by==='due')BUCKETS.forEach(([k,l])=>push(k,l,icon(k==='none'?'calendar':'clock',k==='overdue'?'is-over':''),t=>bucket(t)===k,k==='overdue'?{}:{due:presetDue(k)}));
  else if(by==='list'){spaces().forEach(s=>listsOf(s.id).forEach(l=>push(l.id,l.name,`<span class="sq" style="--c:var(--c${s.color||1})">${esc(initials(s.name)[0])}</span>`,t=>t.listId===l.id,{listId:l.id})));push('none','Senza elenco',icon('list'),t=>!D.lists.has(t.listId),{listId:null})}
  if(board){if(by==='client')return G.filter(g=>g.tasks.length||g.key==='none');return G.filter(g=>g.tasks.length||g.key!=='none'||by==='assignee')}
  return G.filter(g=>g.tasks.length)}

/* ================= automazioni ================= */
let ruleDepth=0;
function runRules(type,id,value){if(ruleDepth>1)return;const t=get('tasks',id);if(!t)return;
  const rs=arr('rules').filter(r=>r.on!==false&&r.trigger?.type===type&&(!TRIG_V[type]||!r.trigger.value||r.trigger.value==='any'||r.trigger.value===value)&&(!r.listId||r.listId===t.listId));
  if(!rs.length)return;ruleDepth++;
  try{for(const r of rs){(r.actions||[]).forEach(a=>applyRuleAction(a,id,r));toast(`Automazione applicata: ${r.name}`)}}finally{ruleDepth--}}
function applyRuleAction(a,id,r){const t=get('tasks',id);if(!t||a.value===undefined)return;
  switch(a.type){
    case 'status':if(ST[a.value]&&t.status!==a.value)setStatus(id,a.value,{auto:r.name,quiet:true});break;
    case 'assign':if(D.members.has(a.value)&&!(t.assignees||[]).includes(a.value))setField(id,'assignees',[...(t.assignees||[]),a.value]);break;
    case 'approver':if(D.members.has(a.value))setField(id,'approverId',a.value);break;
    case 'priority':if(PR[a.value])setField(id,'priority',a.value);break;
    case 'follower':if(D.members.has(a.value)&&!(t.followers||[]).includes(a.value))updTask(id,{followers:[...(t.followers||[]),a.value]});break;
    case 'due':if(!t.due)setField(id,'due',ymd(addDays(today(),+a.value||0)));break;
    case 'list':if(D.lists.has(a.value))setField(id,'listId',a.value);break;
    case 'notify':notify([a.value],'rule',id,`automazione «${r.name}»`);break;}}
function valLabel(kind,v){if(v==null||v==='')return '…';if(kind==='status')return ST[v]?.label||v;if(kind==='prio')return PR[v]?.label||v;if(kind==='member'||kind==='member_any')return v==='any'?'chiunque':mName(v);if(kind==='list')return get('lists',v)?.name||'?';if(kind==='days')return v+' giorni';return v}
function ruleText(r){const tv=TRIG_V[r.trigger.type];return `Quando ${TRIG[r.trigger.type].toLowerCase()}${tv?' '+valLabel(tv,r.trigger.value||'any'):''}${r.listId?` in ${get('lists',r.listId)?.name||'?'}`:''} → ${(r.actions||[]).map(a=>RACT[a.type].toLowerCase().replace(' (se vuota)','').replace(' tra n giorni','')+' '+valLabel(RACT_V[a.type],a.value)).join(', ')}`}

function createTask(data){const id=uid();const now=Date.now();
  const t={title:'',description:'',status:'todo',priority:null,assignees:[],clientId:null,listId:defaultListId(),type:null,due:null,start:null,estimate:null,recurring:null,subtasks:[],comments:[],followers:[],blockedBy:[],approverId:null,activity:[{at:now,by:st.me||null,text:'ha creato l’attività'}],createdAt:now,updatedAt:now,createdBy:st.me||null,completedAt:null,...data};
  if(t.listId)LS.set('lastList',t.listId);Store.put('tasks',id,t);
  notify(t.assignees,'assign',id,'ti ha assegnato');runRules('created',id);return id}
function updTask(id,patch,log){const t=get('tasks',id);if(!t)return;const p={...patch,updatedAt:Date.now()};if(log)p.activity=[...(t.activity||[]).slice(-39),{at:Date.now(),by:st.me||null,text:log}];Store.patch('tasks',id,p)}
function setStatus(id,s,o={}){const t=get('tasks',id);if(!t||t.status===s)return;
  if((s==='progress'||s==='review')&&isBlocked(t)&&!o.auto)toast(`Attenzione: è ancora in attesa di «${openBlockers(t)[0].title}»`);
  if(s==='done'&&t.recurring&&t.due){const nx=nextRecurring(t.due,t.recurring);updTask(id,{status:'todo',due:nx,subtasks:(t.subtasks||[]).map(x=>({...x,done:false})),lastDoneAt:Date.now()},`ha completato · ricorrente, prossima scadenza ${fmtDate(nx)}`);notify(audience(t),o.approved?'approved':'status',id,o.approved?'ha approvato (ricorrente)':'ha completato (ricorrente)');toast(`Attività ricorrente completata. Prossima scadenza: ${fmtDate(nx)}`);return}
  updTask(id,{status:s,completedAt:s==='done'?Date.now():null},o.log||`ha spostato in ${ST[s].label}${o.auto?` (automazione «${o.auto}»)`:''}`);
  runRules('status',id,s);
  const tn=get('tasks',id)||t;const aud=audience(tn);
  if(s==='review'){const to=tn.approverId?[tn.approverId]:[tn.createdBy];notify(to,'approval',id,'ti ha chiesto di approvare');notify(aud.filter(x=>!to.includes(x)),'status',id,'ha spostato in revisione')}
  else if(s==='done'){notify(aud,o.approved?'approved':'status',id,o.approved?'ha approvato':'ha completato');afterDone(t)}
  if(s==='done'&&!o.quiet)toast(o.approved?'Approvata e completata':'Attività completata',{undo:()=>updTask(id,{status:t.status,completedAt:null},`ha riaperto in ${ST[t.status].label}`)})}
function afterDone(t){const freed=arr('tasks').filter(x=>(x.blockedBy||[]).includes(t.id)&&x.status!=='done'&&!isBlocked(x));freed.forEach(x=>notify(x.assignees||[],'unblocked',x.id,`ha completato «${t.title}»: puoi procedere con`));if(freed.length)setTimeout(()=>toast(`Sbloccate ${freed.length} attività in attesa`),400)}
function setField(id,field,val){const t=get('tasks',id);if(!t)return;if(field==='status')return setStatus(id,val);

  const L={priority:v=>'priorità: '+(PR[v]?.label||'nessuna'),due:v=>'scadenza: '+(v?fmtDate(v):'nessuna'),start:v=>'inizio: '+(v?fmtDate(v):'nessuno'),clientId:v=>'cliente: '+(get('clients',v)?.name||'nessuno'),assignees:v=>'persone: '+((v||[]).map(i=>first(get('members',i)?.name)).filter(Boolean).join(', ')||'nessuna'),listId:v=>'elenco: '+(get('lists',v)?.name||'nessuno'),type:v=>'tipo: '+(v||'nessuno'),recurring:v=>'ricorrenza: '+(RECUR[v]||'nessuna'),title:()=>'ha rinominato l’attività',estimate:v=>'stima: '+(v?v+' h':'nessuna'),approverId:v=>'approvatore: '+(v?mName(v):'nessuno')};
  updTask(id,{[field]:val},L[field]?.(val));
  if(field==='assignees'){const added=(val||[]).filter(x=>!(t.assignees||[]).includes(x));notify(added,'assign',id,'ti ha assegnato');added.forEach(m=>runRules('assigned',id,m))}
  if(field==='priority')runRules('priority',id,val);
  if(field==='approverId'&&val&&t.status==='review'&&!ruleDepth)notify([val],'approval',id,'ti ha chiesto di approvare')}
function createClient(name,status='active'){const id=uid();const used=arr('clients').length;Store.put('clients',id,{name:name.trim(),status,color:(used%10)+1,notes:'',createdAt:Date.now()});return id}

/* ================= quick-add parser ================= */
const WDMAP={lun:1,lunedi:1,mar:2,martedi:2,mer:3,mercoledi:3,gio:4,giovedi:4,ven:5,venerdi:5,sab:6,sabato:6,dom:0,domenica:0};
function parseDateWord(w){w=w.toLowerCase().normalize('NFD').replace(/\p{M}/gu,'');const t=today();
  if(w==='oggi')return ymd(t);if(w==='domani')return ymd(addDays(t,1));if(w==='dopodomani')return ymd(addDays(t,2));
  const m=w.match(/^(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?$/);
  if(m){let y=m[3]?+m[3]:t.getFullYear();if(y<100)y+=2000;let d=new Date(y,+m[2]-1,+m[1]);if(d.getMonth()!==+m[2]-1)return null;if(!m[3]&&d<t)d=new Date(y+1,+m[2]-1,+m[1]);return ymd(d)}
  if(w in WDMAP){let n=(WDMAP[w]-t.getDay()+7)%7;if(n===0)n=7;return ymd(addDays(t,n))}return null}
function parseQuick(s){const out={};let title=' '+s;
  title=title.replace(/(\s)@([\p{L}\p{N}._-]+)/gu,(m,sp,tok)=>{const n=norm(tok);const mem=members().find(x=>norm(x.name).startsWith(n)||x.name.split(/\s+/).some(w=>norm(w).startsWith(n)));if(mem&&n){out.assignees=out.assignees||[];if(!out.assignees.includes(mem.id))out.assignees.push(mem.id);return sp}return m});
  title=title.replace(/(\s)#([\p{L}\p{N}.&_-]+)/gu,(m,sp,tok)=>{const n=norm(tok);const c=sortedClients().find(x=>norm(x.name).startsWith(n));if(c&&n){out.clientId=c.id;return sp}return m});
  title=title.replace(/(\s)!(urgente|alta|normale|bassa|u|a|n|b)(?=\s|$)/giu,(m,sp,tok)=>{out.priority={u:'urgent',urgente:'urgent',a:'high',alta:'high',n:'normal',normale:'normal',b:'low',bassa:'low'}[tok.toLowerCase()];return sp});
  title=title.replace(/(\s)(oggi|domani|dopodomani|lunedì|lunedi|martedì|martedi|mercoledì|mercoledi|giovedì|giovedi|venerdì|venerdi|sabato|domenica|lun|mer|gio|ven|sab|\d{1,2}\/\d{1,2}(?:\/\d{2,4})?)(?=\s|$)/giu,(m,sp,tok)=>{if(out.due)return m;const d=parseDateWord(tok);if(d){out.due=d;return sp}return m});
  out.title=title.replace(/\s+/g,' ').trim();return out}

  const all=myNotifs();const un=all.filter(n=>!n.read);const list=st.inboxTab==='unread'?un:all.slice(0,150);
  const tabs=`<div class="tabs"><button class="tab ${st.inboxTab==='unread'?'on':''}" data-act="inbox-tab" data-k="unread">Da leggere <span class="grp-n">${un.length}</span></button><button class="tab ${st.inboxTab==='all'?'on':''}" data-act="inbox-tab" data-k="all">Tutte</button></div>`;
  const t0=today().getTime(),w0=addDays(today(),-7).getTime();
  const grp=[['Oggi',n=>n.at>=t0],['Ultimi 7 giorni',n=>n.at<t0&&n.at>=w0],['Prima',n=>n.at<w0]];
  let body='';
  for(const [l,fn] of grp){const ns=list.filter(fn);if(!ns.length)continue;body+=`<div class="sec-t">${l}</div><div class="nlist">${ns.map(nItem).join('')}</div>`}
  if(!body)body=`<div class="panel" style="align-items:center;text-align:center;padding:40px 16px">${icon('inbox','muted')}<h2>${st.inboxTab==='unread'?'Hai letto tutto':'Nessuna notifica'}</h2><p class="muted" style="margin:0">Qui arrivano assegnazioni, menzioni, commenti, richieste di approvazione e attività sbloccate.</p></div>`;
  return `<div class="page">${header({title:'In arrivo',actions:un.length?`<button class="btn" data-act="read-all">${icon('check')} Segna tutte come lette</button>`:'',lead:'Tutto quello che riguarda te: aprendo una notifica la segni come letta.',tabs})}${banners()}${body}</div>`}
function nItem(n){const t=get('tasks',n.taskId);const by=get('members',n.by);const k=NKIND[n.kind]||['bell',''];
  return `<div class="nitem ${n.read?'':'unread'}" data-act="open-notif" data-id="${n.id}"><span class="ndot ${n.read?'r':''}"></span><span class="nkind nk-${n.kind}">${icon(k[0])}${by?avatar(by):''}</span>
  <div class="nbody"><p><b>${esc(by?.name||'Automazione')}</b> ${esc(n.text||k[1])}</p>${t?`<div class="nt">${statusDot(t.status)}<span class="t">${esc(t.title)}</span>${clientChip(get('clients',t.clientId))}</div>`:`<div class="nt muted">Attività eliminata</div>`}</div>
  <time>${ago(n.at)}</time><button class="ib sm" data-act="del-notif" data-id="${n.id}" title="Archivia">${icon('x')}</button></div>`}

/* ---------- overview ---------- */

  const rev=open.filter(t=>t.status==='review');const wkAgo=Date.now()-7*864e5;const blocked=open.filter(isBlocked).length;
  const doneWk=all.filter(t=>(t.completedAt&&t.completedAt>wkAgo)||(t.lastDoneAt&&t.lastDoneAt>wkAgo)).length;

  const ms=members().map(m=>{const ts=open.filter(t=>(t.assignees||[]).includes(m.id));return {m,ts,todo:ts.filter(t=>t.status==='todo').length,prog:ts.filter(t=>t.status==='progress').length,rev:ts.filter(t=>t.status==='review').length,over:ts.filter(t=>bucket(t)==='overdue').length}}).sort((a,b)=>b.ts.length-a.ts.length);

    ${kpi('','Da approvare',rev.length,'in revisione',{page:'tasks',scope:'all',groupBy:'status'})}

/* ---------- timeline ---------- */
function renderTimeline(tasks,pre,total){
  if(!tasks.length)return emptyTasks(total,pre);
  const month=st.tlZoom==='month';const dw=month?14:34;const t0=today();
  const start=addDays(weekStart(t0),month?-28:-7);const nd=month?182:70;const W=nd*dw;
  const dIdx=s=>dayDiff(start,parseYmd(s));
  let head='',bg='';
  for(let i=0;i<nd;i++){const d=addDays(start,i);
    if(d.getDate()===1||i===0)head+=`<div class="tl-mon" style="left:${i*dw}px">${MOL[d.getMonth()]} ${d.getFullYear()}</div>`;
    if(d.getDay()===0||d.getDay()===6)bg+=`<div class="tl-we" style="left:${i*dw}px;width:${dw}px"></div>`;
    if(!month)head+=`<div class="tl-day ${i===dayDiff(start,t0)?'today':''}" style="left:${i*dw}px;width:${dw}px">${d.getDate()}</div>`;
    else if(d.getDay()===1)head+=`<div class="tl-day" style="left:${i*dw}px;width:${dw*7}px;text-align:left;padding-left:4px">${d.getDate()} ${MO[d.getMonth()]}</div>`}
  const ti=dayDiff(start,t0);bg+=`<div class="tl-today" style="left:${ti*dw+dw/2-1}px"></div>`;
  const groups=groupTasks(tasks,st.groupBy,false);const RH=36,GH=34;let y=0,rows='';const pos={};
  for(const g of groups){
    rows+=`<div class="tl-row g"><div class="tl-name">${st.groupBy==='status'?statusPill(g.key):g.head+`<span class="t">${esc(g.label)}</span>`}<span class="grp-n">${g.tasks.length}</span></div><div class="tl-track" style="width:${W}px"></div></div>`;y+=GH;
    const ts=[...g.tasks].sort((a,b)=>(a.start||a.due||'9999').localeCompare(b.start||b.due||'9999'));
    for(const t of ts){let s=t.start||t.due,e=t.due||t.start;let bar='';
      if(s){if(s>e)[s,e]=[e,s];const a=dIdx(s),b=dIdx(e);const x=a*dw+2,w=Math.max(dw-4,(b-a+1)*dw-4);const late=t.status!=='done'&&t.due&&diffDays(t.due)<0;
        pos[t.id]={x1:x,x2:x+w,y:y+RH/2};

      rows+=`<div class="tl-row"><div class="tl-name" data-act="open-task" data-id="${t.id}">${statusDot(t.status)}<span class="t">${esc(t.title)}</span>${avStack(t.assignees,2)}</div><div class="tl-track ${s?'':'undated'}" style="width:${W}px" ${s?'':`data-act="tl-place" data-id="${t.id}" data-dw="${dw}" data-start="${ymd(start)}" title="Clicca su un giorno per pianificare"`}>${bar}</div></div>`;y+=RH}}
  let arrows='';for(const t of tasks){const p=pos[t.id];if(!p)continue;for(const bid of t.blockedBy||[]){const q=pos[bid];if(!q)continue;const bad=p.x1<q.x2-2;const xm=q.x2+8;arrows+=`<path class="${bad?'bad':''}" d="M${q.x2} ${q.y} H${xm} V${p.y} H${p.x1-3}" marker-end="url(#ar${bad?'b':'n'})"/>`}}

  return `<div class="tl"><div class="tl-scroll" id="tl-scroll" data-today="${ti*dw}"><div class="tl-inner" style="width:calc(var(--tln) + ${W}px)">
  <div class="tl-head"><div class="tl-hname">Trascina le barre per spostare le date</div><div class="tl-htrack" style="width:${W}px">${head}</div></div>
  <div class="tl-body"><div class="tl-bg" style="left:var(--tln);width:${W}px">${bg}</div>${rows}${svg}</div></div></div></div>
  <p class="muted" style="margin:0;font-size:12.5px">Le frecce collegano le dipendenze: una freccia rossa indica un’attività che inizia prima che finisca quella da cui dipende. Le righe senza barra non hanno date: clicca sul giorno per pianificarle.</p>`}

/* ---------- calendar ---------- */
function renderCalendar(tasks,pre){
  const m=new Date(st.calMonth);const first0=new Date(m);const off=(first0.getDay()+6)%7;const start=addDays(first0,-off);
  const byDay={};tasks.forEach(t=>{if(t.due)(byDay[t.due]=byDay[t.due]||[]).push(t)});
  const tk=ymd(today());let cells='';
  for(let i=0;i<42;i++){const d=addDays(start,i);const k=ymd(d);const ts=sortTasks(byDay[k]||[]);const out=d.getMonth()!==m.getMonth();
    if(i===35&&out)break;
    cells+=`<div class="day ${out?'out':''} ${k===tk?'today':''}" data-drop="due" data-val="${k}"><div class="dn"><b>${d.getDate()}</b><button class="ib sm" data-act="new-task" data-preset="${preset({...pre,due:k})}" title="Nuova attività il ${fmtDate(k)}">${icon('plus')}</button></div>
     ${ts.slice(0,4).map(t=>`<div class="cchev ${t.status==='done'?'done':''}" style="--sc:var(--st-${t.status})" draggable="true" data-drag="task" data-id="${t.id}" data-act="open-task" title="${esc(t.title)}"><span>${esc(t.title)}</span></div>`).join('')}
     ${ts.length>4?`<button class="cal-more" data-act="cal-day" data-d="${k}">+${ts.length-4} altre</button>`:''}</div>`}
  const und=sortTasks(tasks.filter(t=>!t.due&&t.status!=='done'));
  const ag=[];for(let i=-7;i<45;i++){const k=ymd(addDays(today(),i));const ts=(byDay[k]||[]).filter(t=>i>=0||t.status!=='done');if(ts.length)ag.push([k,ts])}
  return `<div class="calwrap"><div>
    <div class="cal-h"><h2>${MOL[m.getMonth()]} ${m.getFullYear()}</h2><button class="ib" data-act="cal-move" data-n="-1" aria-label="Mese precedente">${icon('chev-left')}</button><button class="btn" data-act="cal-today">Oggi</button><button class="ib" data-act="cal-move" data-n="1" aria-label="Mese successivo">${icon('chev-right')}</button></div>
    <div class="cal">${['Lun','Mar','Mer','Gio','Ven','Sab','Dom'].map(w=>`<div class="cal-wd">${w}</div>`).join('')}${cells}</div>
    <div class="agenda">${ag.map(([k,ts])=>`<div><div class="sec-t ${diffDays(k)<0?'bad':''}">${diffDays(k)===0?'Oggi':cap(WDL[parseYmd(k).getDay()])+' '+fmtDate(k)}</div><div class="mini panel" style="padding:4px">${ts.map(t=>mrow(t)).join('')}</div></div>`).join('')||`<div class="empty">Nessuna scadenza nelle prossime settimane.</div>`}</div>
  </div>
  <aside class="undated" data-drop="due" data-val="none"><h3>Senza data <span class="grp-n">${und.length}</span></h3><p class="muted" style="margin:0 0 4px;font-size:12px">Trascina un’attività su un giorno per pianificarla.</p>
    ${und.slice(0,30).map(t=>`<div class="cchev" style="--sc:var(--st-${t.status})" draggable="true" data-drag="task" data-id="${t.id}" data-act="open-task"><span>${esc(t.title)}</span></div>`).join('')||`<span class="muted" style="font-size:12.5px">Tutto pianificato.</span>`}</aside></div>`}

/* ---------- team & carico ---------- */
function workload(nw=6){const ws=[...Array(nw)].map((_,i)=>addDays(weekStart(today()),i*7));const w0=ws[0];const res={};
  members().forEach(m=>res[m.id]={weeks:ws.map(()=>({h:0,ts:[]})),undated:[]});
  openTasks().forEach(t=>{const as=(t.assignees||[]).filter(id=>res[id]);if(!as.length)return;const hasEst=t.estimate!=null&&t.estimate!=='';const est=hasEst?+t.estimate:DEF_EST;const share=est/as.length;
    if(!t.due){as.forEach(id=>res[id].undated.push(t));return}
    const t0=today();let s=t.start?parseYmd(t.start):parseYmd(t.due),e=parseYmd(t.due);if(s>e)s=e;if(e<t0){s=t0;e=t0}else if(s<t0)s=t0;
    const days=[];for(let d=new Date(s);d<=e;d=addDays(d,1))if(d.getDay()%6!==0)days.push(new Date(d));if(!days.length)days.push(e);
    const per=share/days.length;
    days.forEach(d=>{const wi=Math.floor(dayDiff(w0,d)/7);if(wi>=0&&wi<nw)as.forEach(id=>{const c=res[id].weeks[wi];c.h+=per;if(!c.ts.includes(t))c.ts.push(t)})})});
  return {ws,res}}
const wkLabel=w=>{const e=addDays(w,6);return `${w.getDate()}${w.getMonth()!==e.getMonth()?' '+MO[w.getMonth()]:''}–${e.getDate()} ${MO[e.getMonth()]}`};
function renderTeam(){
  const tabs=`<div class="tabs"><button class="tab ${st.teamTab==='people'?'on':''}" data-act="team-tab" data-k="people">${icon('users')}Persone</button><button class="tab ${st.teamTab==='workload'?'on':''}" data-act="team-tab" data-k="workload">${icon('gauge')}Carico settimanale</button></div>`;
  const head=header({title:'Team e carico',actions:`<button class="btn" data-act="settings" data-tab="team">${icon('user-plus')} Gestisci persone</button>`,lead:st.teamTab==='people'?'Il carico di ognuno e le scadenze delle prossime due settimane. Più scuro il quadrato, più attività scadono quel giorno.':`Ore stimate per settimana rispetto alla capacità di ognuno. Le attività senza stima valgono ${DEF_EST} h; quelle con inizio e scadenza sono distribuite sui giorni lavorativi.`,tabs});
  if(st.teamTab==='workload')return `<div class="page">${head}${banners()}${renderWorkload()}</div>`;
  const open=openTasks();const t0=today();
  const cards=members().map(m=>{const ts=open.filter(t=>(t.assignees||[]).includes(m.id));const over=ts.filter(t=>bucket(t)==='overdue').length;const wk=ts.filter(t=>['today','week'].includes(bucket(t))).length;const rev=ts.filter(t=>t.status==='review').length;
    const strip=[...Array(14)].map((_,i)=>{const d=addDays(t0,i);const k=ymd(d);const n=ts.filter(t=>t.due===k).length;return `<i data-n="${Math.min(n,3)}" class="${[0,6].includes(d.getDay())?'we':''}" title="${cap(WDL[d.getDay()])} ${fmtDate(k)}: ${n} attività"></i>`}).join('');
    return `<button class="mcard" data-act="nav" data-r="${preset({page:'tasks',scope:'member',id:m.id})}"><div class="mcard-h">${avatar(m,'lg')}<div><b>${esc(m.name)}</b><small>${esc(m.role||'Membro del team')} · ${m.capacity||DEF_CAP} h/sett</small></div></div>
    <div class="mnums"><div><b>${ts.length}</b><span>aperte</span></div><div class="${over?'bad':''}"><b>${over}</b><span>scadute</span></div><div><b>${wk}</b><span>7 giorni</span></div><div><b>${rev}</b><span>revisione</span></div></div>
    <div class="strip">${strip}</div><div class="strip-l"><span>oggi</span><span>+14 giorni</span></div></button>`}).join('');
  return `<div class="page">${head}${banners()}<div class="tgrid">${cards||`<div class="empty">Aggiungi le persone del team dalle impostazioni.</div>`}</div></div>`}
function renderWorkload(){

    ${!alerts.length?`<div class="alert-row good">${icon('check')}<span>Nessuno è oltre la propria capacità nelle prossime 6 settimane.</span></div>`:''}</div>`;
  if(aiOn())h+=`<div class="panel"><div class="panel-h"><h2>${icon('spark','spark')} Ribilanciamento</h2><button class="btn sm ai" data-act="ai-rebalance" ${st.aiBusy.rebalance?'disabled':''}>${sug?'Ricalcola':'Suggerisci con Claude'}</button></div>
    ${st.aiBusy.rebalance?`<div class="thinking">Claude sta confrontando carichi, capacità e scadenze…</div>`:sug?(sug.length?`<div class="mini">${sug.map((s,i)=>{const t=get('tasks',s.taskId);if(!t)return '';return `<div class="mrow" data-act="open-task" data-id="${t.id}"><span class="tt"><b>${esc(t.title)}</b><br><span class="muted" style="font-size:12.5px">${esc(mName(s.from))} → ${esc(mName(s.to))} · ${esc(s.why||'')}</span></span>${s.done?`<span class="muted">Applicato</span>`:`<button class="btn sm" data-act="ai-apply" data-i="${i}">Applica</button>`}</div>`}).join('')}</div>`:`<div class="empty">Claude non vede spostamenti utili: il carico è già equilibrato.</div>`):`<p class="muted" style="margin:0;font-size:13px">Claude propone quali attività spostare da chi è sovraccarico a chi ha spazio, considerando ruoli e scadenze.</p>`}</div>`;
  h+=`<div class="wl"><table><thead><tr><th>Persona</th>${ws.map((w,i)=>`<th class="${i===0?'cur':''}">${i===0?'Questa sett. · ':''}${wkLabel(w)}</th>`).join('')}<th>Senza data</th></tr></thead><tbody>
  ${ms.map(m=>{const capH=m.capacity||DEF_CAP;const r=res[m.id];return `<tr><td><div class="who">${avatar(m)}<div><div>${esc(m.name)}</div><small>${capH} h/sett</small></div></div></td>${r.weeks.map((c,i)=>{const p=c.h/capH;const cls=c.h<.05?'zero':p>1?'over':p>.8?'full':'';return `<td><button class="wlc ${cls}" data-act="wl-cell" data-m="${m.id}" data-w="${i}" title="${c.ts.length} attività"><b>${c.h<.05?'—':Math.round(c.h*10)/10+' h'}</b><span class="wlbar"><i style="width:${Math.min(100,p*100)}%"></i></span><small>${Math.round(p*100)}%</small></button></td>`}).join('')}<td><button class="wlc ${r.undated.length?'':'zero'}" data-act="wl-cell" data-m="${m.id}" data-w="u"><b>${r.undated.length||'—'}</b><small>${r.undated.length?'da pianificare':''}</small></button></td></tr>`}).join('')}</tbody></table></div>`;
  return h}
