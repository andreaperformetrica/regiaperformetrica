const SEARCHABLE={assignees:'Cerca persona',approver:'Cerca persona',client:'Cerca o crea cliente',type:'Cerca o crea tipo',filters:'Filtra opzioni',blocker:'Cerca attività'};
function datePop(field){const t=popTask();const cur=t?.[field];const t0=today();
  const qs=[['Oggi',ymd(t0)],['Domani',ymd(addDays(t0,1))],['Venerdì',nextFriday()],['Lunedì prossimo',nextMonday()],['Tra una settimana',ymd(addDays(t0,7))],['Tra due settimane',ymd(addDays(t0,14))]];
  return qs.map(([l,v])=>opt(v,`<span class="lbl">${l}</span><span class="hint">${cap(WD[parseYmd(v).getDay()])} ${fmtDate(v)}</span>`,cur===v)).join('')+'<div class="pop-sep"></div>'+opt('',icon('x')+'<span class="lbl">Rimuovi data</span>')}
function renderPop(firstR){const p=$('#pop');if(!st.pop){closePop();return}const k=st.pop.kind;
  if(firstR){const s=SEARCHABLE[k];const isDate=k==='due'||k==='start';const cur=isDate?popTask()?.[k]:'';
    p.innerHTML=(s?`<div class="pop-s">${icon('search')}<input id="pop-q" placeholder="${s}" autocomplete="off"></div>`:'')+`<div class="pop-l" id="pop-l"></div>`+(isDate?`<div class="pop-date"><input type="date" id="pop-date" value="${cur||''}" aria-label="Scegli una data"></div>`:'');
    p.style.width=k==='filters'||k==='blocker'||k==='wlcell'?'300px':'260px';p.hidden=false}
  $('#pop-l').innerHTML=POPS[k]();
  if(firstR){const r=st.pop.rect;const ph=p.offsetHeight,pw=p.offsetWidth;let top=r.b+4;if(top+ph>innerHeight-8)top=Math.max(8,r.t-ph-4);let left=Math.min(r.l,innerWidth-pw-8);p.style.top=top+'px';p.style.left=Math.max(8,left)+'px';if(k!=='mention')$('#pop-q')?.focus()}}
function applyPick(val){const {kind,ctx}=st.pop;
  const setVal=(field,v,keep)=>{
    if(ctx.draft){st.qa[field]=v;renderQAChips()}
    else if(ctx.bulk){const ids=bulkIds();if(field==='status')ids.forEach(i=>setStatus(i,v,{quiet:true}));else ids.forEach(i=>setField(i,field,v));if(!keep)toast(`Aggiornate ${ids.length} attività`)}
    else if(ctx.id)setField(ctx.id,field,v);
    if(keep)renderPop();else closePop()};
  switch(kind){
    case 'status':return setVal('status',val);
    case 'priority':return setVal('priority',val||null);
    case 'assignees':{if(ctx.bulk){const ids=bulkIds();const all=ids.every(i=>(get('tasks',i).assignees||[]).includes(val));ids.forEach(i=>{const a=get('tasks',i).assignees||[];setField(i,'assignees',all?a.filter(x=>x!==val):[...new Set([...a,val])])});renderPop();return}
      const t=popTask();const cur=t?.assignees||[];return setVal('assignees',cur.includes(val)?cur.filter(x=>x!==val):[...cur,val],true)}
    case 'approver':return setVal('approverId',val||null);
    case 'client':return setVal('clientId',val==='__new'?createClient(st.pop.q):(val||null));
    case 'due':case 'start':return setVal(kind,val||null);
    case 'type':return setVal('type',val==='__new'?st.pop.q.trim():(val||null));
    case 'list':if(val)LS.set('lastList',val);return setVal('listId',val||null);
    case 'recurring':return setVal('recurring',val||null);
    case 'blocker':{const t=get('tasks',ctx.id);updTask(t.id,{blockedBy:[...(t.blockedBy||[]),val]},`in attesa di «${get('tasks',val)?.title}»`);closePop();return refreshDrawer()}
    case 'template':closePop();return applyTemplate(val);
    case 'mention':closePop();return insertMention(val);
    case 'groupBy':st.groupBy=val;LS.set('groupBy',val);closePop();return scheduleRender();
    case 'sort':st.sort=val;LS.set('sort',val);closePop();return scheduleRender();
    case 'filters':{if(val==='clear'){clearFilters();closePop();return}const [k,id]=val.split(':');const key={a:'assignees',c:'clients',p:'priorities'}[k];const a=st.filters[key];st.filters[key]=a.includes(id)?a.filter(x=>x!==id):[...a,id];renderPop();return scheduleRender()}
    case 'me':closePop();return setMe(val);
    case 'cstatus':closePop();return Store.patch('clients',ctx.id,{status:val});
  }}

function valSelect(kind,v,id){const o=(val,l)=>`<option value="${esc(val)}" ${String(v??'')===String(val)?'selected':''}>${esc(l)}</option>`;
  if(kind==='days')return `<input type="number" id="${id}" min="0" max="365" value="${v??7}" style="width:80px" aria-label="Giorni"> <span class="muted">giorni</span>`;
  let opts='';if(kind==='status')opts=STATUSES.map(s=>o(s.id,s.label)).join('');else if(kind==='prio')opts=PRIOS.map(p=>o(p.id,p.label)).join('');else if(kind==='member'||kind==='member_any')opts=(kind==='member_any'?o('any','Chiunque'):o('','Scegli persona…'))+members().map(m=>o(m.id,m.name)).join('');else if(kind==='list')opts=o('','Scegli elenco…')+arr('lists').map(l=>o(l.id,l.name)).join('');
  return `<select id="${id}" aria-label="Valore">${opts}</select>`}

document.addEventListener('click',e=>{
  if(st.tlDragJust){st.tlDragJust=false;return}

  if(st.pop&&!e.target.closest('#pop')&&!(a&&a.dataset.act==='pop'&&a===st.pop.anchor)&&!(st.pop.kind==='mention'&&e.target.id==='cm-new'))closePop();

document.addEventListener('input',e=>{const el=e.target;
  if(el.id==='q'){st.filters.q=el.value;scheduleRender()}
  else if(el.id==='pop-q'){st.pop.q=el.value;renderPop()}
  else if(el.id==='qa-title'){st.qa.raw=el.value;st.qa.parsed=parseQuick(el.value);renderQAChips()}
  else if(el.id==='qa-desc'){st.qa.description=el.value}

  if(el.matches('textarea[data-auto]'))autosize(el)});

document.addEventListener('keydown',e=>{

  if(st.pop&&st.pop.kind==='mention'&&t.id==='cm-new'&&(e.key==='Enter'||e.key==='Tab')){const f=$('#pop-l .opt');if(f){e.preventDefault();f.click();return}}
  if(st.pop&&(e.key==='Enter')&&t.id==='pop-q'){e.preventDefault();const f=$('#pop-l .opt');f&&f.click();return}
  if(t.id==='pal-q'){if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();const n=st.palR.length;if(n){st.palIdx=(st.palIdx+(e.key==='ArrowDown'?1:-1)+n)%n;renderPal()}return}
    if(e.key==='Enter'){e.preventDefault();const it=st.palR[st.palIdx];if(it)it.run();else if(st.palQ){const q=st.palQ;closeModal();openQA();st.qa.raw=q;st.qa.parsed=parseQuick(q);renderModal()}return}}
  if(t.id==='ask-q'&&e.key==='Enter'){e.preventDefault();askRun();return}
  if(t.id==='qa-title'&&e.key==='Enter'){e.preventDefault();qaCreate();return}
  if(t.id==='qa-desc'&&e.key==='Enter'&&mod){e.preventDefault();qaCreate();return}
  if(t.id==='qa-brief'&&e.key==='Enter'&&mod){e.preventDefault();aiExtract();return}
  if(t.classList&&t.classList.contains('inline-add')&&e.key==='Enter'){e.preventDefault();const v=t.value.trim();if(!v)return;const p=parseQuick(v);const pre=JSON.parse(t.dataset.preset||'{}');
    const data={...pre,title:p.title||v};if(p.assignees)data.assignees=[...new Set([...(pre.assignees||[]),...p.assignees])];if(p.clientId)data.clientId=p.clientId;if(p.priority)data.priority=p.priority;if(p.due)data.due=p.due;if(!data.type){const gt=guessType(data.title);if(gt)data.type=gt}
    createTask(data);t.value='';return}
  if(t.id==='sub-new'&&e.key==='Enter'){e.preventDefault();const v=t.value.trim();if(!v)return;const tk=get('tasks',st.openTask);updTask(tk.id,{subtasks:[...(tk.subtasks||[]),{id:uid(),title:v,done:false}]});t.value='';refreshDrawer();$('#sub-new')?.focus();return}
  if(t.classList&&t.classList.contains('sub-t')&&e.key==='Enter'){e.preventDefault();t.blur();return}
  if(t.classList&&t.classList.contains('ext')&&e.key==='Enter'){e.preventDefault();return}
  if(t.id==='dt-title'&&e.key==='Enter'){e.preventDefault();t.blur();return}
  if(t.id==='cm-new'&&e.key==='Enter'&&mod){e.preventDefault();sendComment();return}
  if(t.id==='nf-name'&&e.key==='Enter'){e.preventDefault();ACT['name-save']();return}
  if(t.id==='cf-name'&&e.key==='Enter'){e.preventDefault();ACT['cf-save']();return}
  if(t.id==='m-new'&&e.key==='Enter'){e.preventDefault();const v=t.value.trim();if(!v)return;Store.put('members',uid(),{name:v,role:'',capacity:DEF_CAP,color:(arr('members').length%10)+1,createdAt:Date.now()});renderModal();setTimeout(()=>$('#m-new')?.focus(),0);return}
  if(t.id==='s-new'&&e.key==='Enter'){e.preventDefault();const v=t.value.trim();if(!v)return;const id=uid();Store.put('spaces',id,{name:v,color:(arr('spaces').length%10)+1,order:Date.now()});renderModal();setTimeout(()=>$('#l-new-'+id)?.focus(),0);return}
  if(t.dataset&&t.dataset.newlist&&e.key==='Enter'){e.preventDefault();const v=t.value.trim();if(!v)return;Store.put('lists',uid(),{name:v,spaceId:t.dataset.newlist,order:Date.now()});const fid=t.id;renderModal();setTimeout(()=>{const x=document.getElementById(fid);if(x){x.value='';x.focus()}},0);return}
  if(typing||mod||e.altKey||st.modal)return;
  if(e.key==='n'||e.key==='N'){e.preventDefault();openQA();return}
  if(e.key==='/'){const q=$('#q');if(q){e.preventDefault();q.focus()}return}
  if(e.key==='?'){openModal('help');return}
  if(st.route.page==='tasks'&&['1','2','3','4'].includes(e.key)){st.views[viewKey()]=['list','board','timeline','calendar'][+e.key-1];LS.set('views',st.views);render()}});
function sendComment(){const el=$('#cm-new');const v=el?.value.trim();if(!v||!st.openTask)return;const t=get('tasks',st.openTask);
  const mentions=members().filter(m=>v.includes('@'+m.name)).map(m=>m.id);const short=v.replace(/\s+/g,' ').slice(0,90)+(v.length>90?'…':'');

  updTask(t.id,{comments:[...(t.comments||[]),{id:uid(),by:st.me||null,text:v,at:Date.now(),mentions}].slice(-200),followers});
  notify(mentions,'mention',t.id,`ti ha menzionato: “${short}”`);notify(audience(t).filter(x=>!mentions.includes(x)),'comment',t.id,`ha commentato: “${short}”`);

/* drag & drop (HTML5) */
let drag=null;
document.addEventListener('dragstart',e=>{const el=e.target.closest&&e.target.closest('[data-drag]');if(!el)return;drag={kind:el.dataset.drag,id:el.dataset.id,from:el.closest('[data-drop]')?.dataset.val};try{e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',el.dataset.id)}catch{}requestAnimationFrame(()=>el.classList.add('dragging'))});
document.addEventListener('dragend',()=>{document.querySelectorAll('.dragging,.over').forEach(x=>x.classList.remove('dragging','over'));drag=null});
document.addEventListener('dragover',e=>{if(!drag)return;const z=e.target.closest&&e.target.closest('[data-drop]');if(!z)return;if((drag.kind==='client')!==(z.dataset.drop==='cstatus'))return;if(z.dataset.drop==='due'&&z.dataset.val==='overdue')return;e.preventDefault();document.querySelectorAll('.over').forEach(x=>x!==z&&x.classList.remove('over'));z.classList.add('over')});
document.addEventListener('drop',e=>{const z=e.target.closest&&e.target.closest('[data-drop]');if(!drag||!z)return;e.preventDefault();const d=drag;drag=null;document.querySelectorAll('.over,.dragging').forEach(x=>x.classList.remove('over','dragging'));handleDrop(z.dataset.drop,z.dataset.val,d)});
function handleDrop(field,val,d){
  if(d.kind==='client'){if(field==='cstatus')Store.patch('clients',d.id,{status:val});return}
  const t=get('tasks',d.id);if(!t)return;
  if(field==='status')return setStatus(t.id,val);
  if(field==='priority')return setField(t.id,'priority',val==='none'?null:val);
  if(field==='client')return setField(t.id,'clientId',val==='none'?null:val);
  if(field==='list')return val!=='none'&&setField(t.id,'listId',val);
  if(field==='assignee'){let a=(t.assignees||[]).filter(x=>x!==d.from);if(val==='none')a=[];else if(!a.includes(val))a.push(val);return setField(t.id,'assignees',a)}
  if(field==='due'){if(/^\d{4}-/.test(val))return setField(t.id,'due',val);const p=presetDue(val);if(p!==undefined)setField(t.id,'due',p)}}

/* timeline drag (pointer) */
document.addEventListener('pointerdown',e=>{const h=e.target.closest&&e.target.closest('[data-tl]');if(!h||e.button!==0)return;const bar=h.closest('.bar');if(!bar)return;e.preventDefault();
  st.tlDrag={id:bar.dataset.id,mode:h.dataset.tl,x0:e.clientX,bar,dw:+bar.dataset.dw,left:bar.offsetLeft,width:bar.offsetWidth,dd:0,moved:false};try{bar.setPointerCapture(e.pointerId)}catch{}bar.classList.add('dragging')});
document.addEventListener('pointermove',e=>{const d=st.tlDrag;if(!d)return;const dx=e.clientX-d.x0;if(Math.abs(dx)>3)d.moved=true;d.dd=Math.round(dx/d.dw);const dw=d.dw;
  if(d.mode==='move')d.bar.style.left=(d.left+d.dd*dw)+'px';
  else if(d.mode==='end')d.bar.style.width=Math.max(dw-4,d.width+d.dd*dw)+'px';
  else{const nw=Math.max(dw-4,d.width-d.dd*dw);d.bar.style.left=(d.left+d.width-nw)+'px';d.bar.style.width=nw+'px'}});
document.addEventListener('pointerup',()=>{const d=st.tlDrag;if(!d)return;st.tlDrag=null;d.bar.classList.remove('dragging');
  st.tlDragJust=true;setTimeout(()=>st.tlDragJust=false,0);
  if(!d.moved){openTask(d.id);return}
  const t=get('tasks',d.id);if(!t||!d.dd){render();return}
  let s=t.start||t.due,en=t.due||t.start;if(s>en)[s,en]=[en,s];const sh=(x,n)=>ymd(addDays(parseYmd(x),n));
  if(d.mode==='move'){const p={due:sh(en,d.dd)};if(t.start)p.start=sh(t.start,d.dd);updTask(t.id,p,`ha spostato le date: ${p.start?fmtDate(p.start)+' → ':''}${fmtDate(p.due)}`)}
  else if(d.mode==='end'){let nd=sh(en,d.dd);if(nd<s)nd=s;const p={due:nd};if(!t.start&&nd!==s)p.start=s;updTask(t.id,p,`scadenza: ${fmtDate(nd)}`)}
  else{let ns=sh(s,d.dd);if(ns>en)ns=en;const p={start:ns};if(!t.due)p.due=en;updTask(t.id,p,`inizio: ${fmtDate(ns)}`)}});

/* ================= avvio ================= */
async function boot(){
  const h=(location.hash||'').slice(1);if(['home','overview','clients','team','inbox'].includes(h))st.route={page:h};
  render();
  let db=null,user=null,sample=null;
  if(window.claude&&typeof window.claude.use==='function'){try{[db,user,sample]=await Promise.all([window.claude.use('db'),window.claude.use('user'),window.claude.use('sample').catch(()=>null)])}catch{}}
  st.ai=sample||null;
  if(db){
    st.mode='db';Store.db=db;
    if(user){try{st.userId=await user.id()}catch{}try{const w=await user.can('data.write');if(w===false)st.readOnly=true}catch{}}
    const pending=new Set(COLLS);
    COLLS.forEach(c=>db.collection(c).onSnapshot(snap=>{D[c]=new Map(snap.docs.map(d=>[d.id,{...d.data(),id:d.id}]));pending.delete(c);
      if(!pending.size&&!st.ready){st.ready=true;if(st.userId){const m=arr('members').find(x=>x.userId===st.userId);if(m){st.me=m.id;LS.set('me',m.id)}}setTimeout(pruneNotifs,1500)}
      if(st.openTask&&!D.tasks.has(st.openTask))st.openTask=null;scheduleRender()},err=>{toast('Connessione ai dati interrotta. Ricarica la pagina.');console.warn(err)}));
    setTimeout(()=>{if(!st.ready){st.ready=true;scheduleRender()}},8000);
  }else{st.mode='local';loadLocal();st.ready=true;render();setTimeout(pruneNotifs,1500)}
}
boot();
